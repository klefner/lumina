name: Stage site files
description: Stamps the build version and copies player-facing files into _site/, shared by every deploy target so they're never out of sync.
outputs:
  build:
    description: Short git SHA used as the build stamp
    value: ${{ steps.stamp.outputs.build }}
runs:
  using: composite
  steps:
    - name: Stamp build version
      id: stamp
      shell: bash
      run: |
        BUILD="${GITHUB_SHA::7}"
        VERSION="${BUILD} . $(date -u +%Y-%m-%d)"
        sed -i "s/__BUILD__/${BUILD}/g; s/__VERSION__/${VERSION}/g" index.html version.json
        echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
    # package.json/tests/CI config etc. exist for the CI workflow, not for
    # players, and have no reason to ever be part of the deployed artifact.
    - name: Stage site files
      shell: bash
      run: |
        mkdir -p _site
        cp index.html game.js style.css manifest.json version.json _site/
        cp -r icons sounds _site/
