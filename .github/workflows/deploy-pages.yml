name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can be run against any branch from the Actions UI;
    # without this guard, a manual dispatch from a feature branch would stage
    # that branch's unreviewed content and still push it to Cloudflare as the
    # canonical `main` deployment (the wrangler command below hardcodes
    # --branch=main). Restrict the whole job to the actual main branch so
    # only a real push to (or dispatch against) main can ever go live.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site files
        uses: ./.github/actions/stage-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Cloudflare Pages is the canonical player-facing URL (no personal name
      # in it, unlike the klefner.github.io one above). Same staged _site
      # directory, so there is exactly one build output, not two.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=lumina --branch=main
      # itch.io deploys via its own separate job (deploy-itch.yml), kept
      # split out so its build-stamping/staging/butler steps don't clutter
      # this file, but it shares the same `push` trigger -- every merge to
      # main ships to all three targets together again (reverted the
      # PR #78 manual-approval split; see deploy-itch.yml's header comment
      # for why).
